<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yappr</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="theme-color" content="#d6633b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Yappr" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Yappr</h1>
      <button id="logout" class="link-btn">Log out</button>
    </header>

    <form id="add-form" class="card">
      <input type="text" id="title" placeholder="What do you need to do?" required />
      <textarea id="notes" placeholder="Notes (optional)"></textarea>
      <div class="row">
        <label>
          Due
          <input type="datetime-local" id="dueAt" required />
        </label>
        <label>
          Repeats
          <select id="recurring">
            <option value="none">Once</option>
            <option value="daily">Daily</option>
            <option value="weekdays">Weekdays</option>
            <option value="weekly">Weekly</option>
            <option value="every">Every N days</option>
          </select>
        </label>
        <label id="every-n-label" hidden>
          Every
          <input type="number" id="everyNDays" min="2" max="365" value="3" /> days
        </label>
        <label>
          Re-nag every (min)
          <input type="number" id="nagMinutes" min="1" value="15" />
        </label>
      </div>
      <div class="row">
        <button type="submit" id="submit-btn">Add reminder</button>
        <button type="button" id="cancel-edit" hidden class="link-btn">Cancel</button>
      </div>
    </form>

    <section id="notif-banner" class="banner" hidden>
      <span>Turn on browser notifications to get alerts on this laptop.</span>
      <button id="enable-notif">Enable</button>
    </section>

    <section>
      <h2>Today</h2>
      <ul id="today-list" class="task-list"></ul>
    </section>

    <section>
      <h2>Tomorrow</h2>
      <ul id="tomorrow-list" class="task-list"></ul>
    </section>

    <section>
      <h2>Later</h2>
      <ul id="later-list" class="task-list"></ul>
    </section>

    <section>
      <h2>Done</h2>
      <ul id="done-list" class="task-list"></ul>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
